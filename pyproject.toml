[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-stonk"
version = "0.1.0"
description = "Test bot: post-only limit ladder on Gate spot STONK_USDT priced from an own futures index, no hedging"
requires-python = ">=3.11,<3.14"
dependencies = ["requests==2.32.5", "websocket-client==1.9.0", "PyYAML==6.0.3", "python-dotenv==1.2.2", "filelock==3.29.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
gate-stonk = "gate_stonk.cli:main"

[tool.setuptools.packages.find]
include = ["gate_stonk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
